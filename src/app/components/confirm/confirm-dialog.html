<div *ngIf="open" class="cdk-container" (click)="onBackdropClick($event)">
  <div class="cdk-backdrop"></div>
  <div class="cdk-panel" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="panel-header">
      <div id="confirm-title" class="h6 mb-0">{{ title }}</div>
      <button class="btn btn-light btn-sm" (click)="close('cancel')" aria-label="Đóng">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="panel-body">
      <ng-container *ngIf="message; else projected">
        <p class="mb-0">{{ message }}</p>
      </ng-container>
      <ng-template #projected>
        <ng-content></ng-content>
      </ng-template>
    </div>

    <div class="panel-actions">
      <button class="btn btn-outline-secondary" (click)="cancel()">{{ cancelText }}</button>
      <button class="btn" [ngClass]="confirmBtnClass" (click)="confirm()">{{ confirmText }}</button>
    </div>
  </div>
</div>
