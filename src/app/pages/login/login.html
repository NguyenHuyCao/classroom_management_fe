<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-lg-5">
          <div class="text-center mb-3">
            <img src="assets/logo-classroom.svg" alt="Logo" width="84" height="84" class="mb-2">
            <h1 class="h4 text-primary mb-0">Đăng nhập</h1>
            <div class="text-secondary">Quản lý lớp học</div>
          </div>

          <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="mb-3 form-floating">
              <input type="text" class="form-control" id="username" placeholder="username"
                    formControlName="username" autocomplete="username">
              <label for="username"><i class="bi bi-person me-2"></i>Tên đăng nhập</label>
              <div class="form-text text-danger" *ngIf="f.username.touched && f.username.invalid">
                Vui lòng nhập tối thiểu 3 ký tự.
              </div>
            </div>

            <div class="mb-3 input-group">
              <div class="form-floating flex-grow-1">
                <input [type]="showPwd() ? 'text' : 'password'" class="form-control" id="password"
                       placeholder="password" formControlName="password" autocomplete="current-password">
                <label for="password"><i class="bi bi-shield-lock me-2"></i>Mật khẩu</label>
              </div>
              <button type="button" class="btn btn-outline-secondary" (click)="showPwd.set(!showPwd())"
                      [attr.aria-pressed]="showPwd()">
                <i class="bi" [ngClass]="showPwd() ? 'bi-eye-slash' : 'bi-eye'"></i>
              </button>
            </div>
            <div class="form-text text-danger mb-2" *ngIf="f.password.touched && f.password.invalid">
              Mật khẩu tối thiểu 6 ký tự.
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember" formControlName="remember">
                <label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label>
              </div>
              <a class="link-primary text-decoration-none cursor-pointer" routerLink="/forgot">Quên mật khẩu?</a>
            </div>

            <button class="btn btn-primary w-100 py-2" [disabled]="form.invalid || loading()" type="submit">
              <span *ngIf="!loading()">Đăng nhập</span>
              <span *ngIf="loading()" class="spinner-border spinner-border-sm me-2" role="status"></span>
              <span *ngIf="loading()">Đang xử lý...</span>
            </button>

            <div class="text-danger text-center mt-3" *ngIf="err()">{{ err() }}</div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
