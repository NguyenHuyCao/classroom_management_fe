<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-lg-5">
          <div class="text-center mb-4">
            <img src="assets/logo-classroom.svg" alt="Logo" width="84" height="84" class="mb-2">
            <h1 class="h4 text-primary mb-0">Quên mật khẩu</h1>
            <div class="text-secondary">Khôi phục truy cập tài khoản</div>
          </div>

          <form *ngIf="step()===1" [formGroup]="emailForm" (ngSubmit)="sendEmail()">
            <div class="mb-3 form-floating">
              <input type="email" class="form-control" id="email" placeholder="email" formControlName="email">
              <label for="email"><i class="bi bi-envelope me-2"></i>Email</label>
            </div>
            <div class="text-danger text-center mb-2" *ngIf="err()">{{ err() }}</div>
            <button class="btn btn-primary w-100 py-2" type="submit" [disabled]="emailForm.invalid || loading()">
              <span *ngIf="!loading()">Gửi mã xác nhận</span>
              <span *ngIf="loading()" class="spinner-border spinner-border-sm me-2"></span>
              <span *ngIf="loading()">Đang gửi...</span>
            </button>
            <div class="text-center mt-3">
              <a routerLink="/login" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Quay lại đăng nhập</a>
            </div>
          </form>

          <form *ngIf="step()===2" [formGroup]="codeForm" (ngSubmit)="verifyCode()">
            <div class="alert alert-info py-2" *ngIf="info()">{{ info() }}</div>
            <div class="mb-3 form-floating">
              <input type="text" class="form-control" id="code" placeholder="123456" formControlName="code" inputmode="numeric">
              <label for="code"><i class="bi bi-123 me-2"></i>Mã xác nhận</label>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span class="text-muted small">* Kiểm tra hộp thư / spam nếu chưa thấy.</span>
              <button type="button" class="btn btn-link p-0" (click)="resend()" [disabled]="countdown()>0">
                Gửi lại mã <span *ngIf="countdown()>0">({{ countdown() }}s)</span>
              </button>
            </div>
            <div class="text-danger text-center mb-2" *ngIf="err()">{{ err() }}</div>
            <button class="btn btn-primary w-100 py-2" type="submit" [disabled]="codeForm.invalid || loading()">
              <span *ngIf="!loading()">Xác nhận</span>
              <span *ngIf="loading()" class="spinner-border spinner-border-sm me-2"></span>
              <span *ngIf="loading()">Đang kiểm tra...</span>
            </button>
            <div class="text-center mt-3">
              <a routerLink="/login" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Quay lại đăng nhập</a>
            </div>
          </form>

          <form *ngIf="step()===3" [formGroup]="resetForm" (ngSubmit)="updatePassword()">
            <div class="mb-3 form-floating">
              <input type="password" class="form-control" id="newPwd" placeholder="new" formControlName="password" autocomplete="new-password">
              <label for="newPwd"><i class="bi bi-shield-lock me-2"></i>Mật khẩu mới</label>
            </div>
            <div class="mb-3 form-floating">
              <input type="password" class="form-control" id="confirm" placeholder="confirm" formControlName="confirm" autocomplete="new-password">
              <label for="confirm"><i class="bi bi-shield-check me-2"></i>Nhập lại mật khẩu mới</label>
            </div>
            <div class="text-danger text-center mb-2" *ngIf="err()">{{ err() }}</div>
            <button class="btn btn-primary w-100 py-2" type="submit" [disabled]="resetForm.invalid || loading()">
              <span *ngIf="!loading()">Cập nhật</span>
              <span *ngIf="loading()" class="spinner-border spinner-border-sm me-2"></span>
              <span *ngIf="loading()">Đang cập nhật...</span>
            </button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
