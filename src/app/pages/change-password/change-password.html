<app-section-title title="Đổi mật khẩu"></app-section-title>

<div class="p-4" style="max-width: 560px; margin: 0 auto">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3 row align-items-center">
      <label for="oldPassword" class="col-5 col-form-label text-end">Mật khẩu hiện tại:</label>
      <div class="col-7">
        <div class="input-group">
          <input
            [type]="showOld() ? 'text' : 'password'"
            class="form-control"
            id="oldPassword"
            formControlName="currentPassword"
            placeholder="Nhập mật khẩu hiện tại"
            autocomplete="current-password"
          />
          <button type="button" class="btn btn-outline-secondary" (click)="showOld.set(!showOld())">
            <i class="bi" [ngClass]="showOld() ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
        <div class="form-text text-danger" *ngIf="f.currentPassword.touched && f.currentPassword.invalid">
          Mật khẩu tối thiểu 6 ký tự.
        </div>
      </div>
    </div>

    <div class="mb-3 row align-items-center">
      <label for="newPassword" class="col-5 col-form-label text-end">Mật khẩu mới:</label>
      <div class="col-7">
        <div class="input-group">
          <input
            [type]="showNew() ? 'text' : 'password'"
            class="form-control"
            id="newPassword"
            formControlName="newPassword"
            placeholder="Nhập mật khẩu mới"
            autocomplete="new-password"
          />
          <button type="button" class="btn btn-outline-secondary" (click)="showNew.set(!showNew())">
            <i class="bi" [ngClass]="showNew() ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
        <div class="form-text text-danger" *ngIf="f.newPassword.touched && f.newPassword.invalid">
          Mật khẩu tối thiểu 6 ký tự.
        </div>
      </div>
    </div>

    <div class="mb-4 row align-items-center">
      <label for="confirmPassword" class="col-5 col-form-label text-end">Xác nhận mật khẩu mới:</label>
      <div class="col-7">
        <div class="input-group">
          <input
            [type]="showCf() ? 'text' : 'password'"
            class="form-control"
            id="confirmPassword"
            formControlName="confirmPassword"
            placeholder="Xác nhận mật khẩu mới"
            autocomplete="new-password"
          />
          <button type="button" class="btn btn-outline-secondary" (click)="showCf.set(!showCf())">
            <i class="bi" [ngClass]="showCf() ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
        <div class="form-text text-danger" *ngIf="f.confirmPassword.touched && (f.confirmPassword.invalid || (f.confirmPassword.value && f.confirmPassword.value !== f.newPassword.value))">
          Mật khẩu xác nhận không khớp.
        </div>
      </div>
    </div>

    <div *ngIf="err()" class="text-danger text-center mb-3" style="font-size: 15px">
      {{ err() }}
    </div>
    <div *ngIf="ok()" class="text-success text-center mb-3" style="font-size: 15px">
      <i class="bi bi-check-circle-fill" style="font-size: 18px; color: #16a34a; vertical-align: middle"></i>
      <span style="vertical-align: middle">{{ ok() }}</span>
    </div>

    <div class="text-center">
      <button
        type="submit"
        class="btn px-5"
        [ngClass]="ok() ? 'btn-success' : 'btn-primary'"
        [disabled]="form.invalid || loading()"
      >
        <span *ngIf="!loading()">Đổi mật khẩu</span>
        <span *ngIf="loading()" class="spinner-border spinner-border-sm me-2" role="status"></span>
        <span *ngIf="loading()">Đang xử lý...</span>
      </button>
    </div>
  </form>
</div>

<app-confirm-dialog
  [open]="showConfirmPostChange()"
  title="Đổi mật khẩu thành công"
  message="Bạn có muốn đăng xuất và đăng nhập lại bằng mật khẩu mới không?"
  confirmText="Đăng xuất"
  cancelText="Để sau"
  tone="primary"
  (confirmed)="confirmLogoutAfterChange()"
  (canceled)="cancelPostChange()"
  (closed)="cancelPostChange()"
></app-confirm-dialog>
