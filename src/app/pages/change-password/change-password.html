<app-section-title title="Đổi mật khẩu"></app-section-title>

<div class="p-4" style="max-width: 500px; margin: 0 auto">
  <form #form="ngForm" (ngSubmit)="onSubmit()">
    <div class="mb-3 row align-items-center">
      <label for="oldPassword" class="col-5 col-form-label text-end">Mật khẩu cũ:</label>
      <div class="col-7">
        <input
          type="password"
          class="form-control"
          id="oldPassword"
          name="oldPassword"
          [(ngModel)]="oldPassword"
          placeholder="Nhập mật khẩu cũ"
          required
        />
      </div>
    </div>
    <div class="mb-3 row align-items-center">
      <label for="newPassword" class="col-5 col-form-label text-end">Mật khẩu mới:</label>
      <div class="col-7">
        <input
          type="password"
          class="form-control"
          id="newPassword"
          name="newPassword"
          [(ngModel)]="newPassword"
          placeholder="Nhập mật khẩu mới"
          required
        />
      </div>
    </div>
    <div class="mb-4 row align-items-center">
      <label for="confirmPassword" class="col-5 col-form-label text-end">
        Xác nhận mật khẩu mới:
      </label>
      <div class="col-7">
        <input
          type="password"
          class="form-control"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Xác nhận mật khẩu mới"
          required
        />
      </div>
    </div>

    <div *ngIf="errorMessage" class="text-danger text-center mb-3" style="font-size: 15px">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="text-success text-center mb-3" style="font-size: 15px">
      <i class="bi bi-check-circle-fill" style="font-size: 18px; color: #16a34a; vertical-align: middle"></i>
      <span style="vertical-align: middle">{{ successMessage }}</span>
    </div>

    <div class="text-center">
      <button
        type="submit"
        [ngClass]="successMessage ? 'btn btn-success px-5' : 'btn btn-outline-danger px-5'"
      >
        Đổi mật khẩu
      </button>
    </div>
  </form>
</div>

<app-confirm-dialog
  [open]="showConfirmPostChange"
  title="Đổi mật khẩu thành công"
  message="Bạn có muốn đăng xuất và đăng nhập lại bằng mật khẩu mới không?"
  confirmText="Đăng xuất"
  cancelText="Để sau"
  tone="primary"
  (confirmed)="confirmLogoutAfterChange()"
  (canceled)="cancelPostChange()"
  (closed)="cancelPostChange()"
></app-confirm-dialog>
